<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кот и Мышка</title>
    <style>
        body { margin: 0; padding: 0; background: #0f2027; overflow: hidden; }
    </style>
</head>
<body>
    <script>
        const stage = document.createElement('div');
        stage.style = 'width:100vw; height:100vh; background: linear-gradient(135deg, #0f2027, #2c5364); position:fixed; left:0; top:0; overflow:hidden; font-family: sans-serif; user-select:none; touch-action:none;';
        document.body.appendChild(stage);

        const cat = document.createElement('div');
        cat.innerHTML = '🐱'; 
        cat.style = 'font-size:50px; position:absolute; left:50px; top:40%; display:none; z-index:5;';
        stage.appendChild(cat);

        const mouse = document.createElement('div');
        mouse.innerHTML = '🐭'; 
        mouse.style = 'font-size:40px; position:absolute; left:70%; top:40%; display:none; z-index:4;';
        stage.appendChild(mouse);

        let mouseX = 0, mouseY = 0, catX = 0, catY = 0;
        let mouseSpeed = 5; 
        let gameActive = false;
        let gameLoop;

        const menu = document.createElement('div');
        menu.style = 'position:absolute; width:100%; height:100%; background:rgba(15,32,39,0.95); display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; z-index:10; text-align:center;';
        menu.innerHTML = '<h1 style="margin:0 0 10px 0; font-size:32px; color:#00d2ff;">КОТ И МЫШКА</h1><p style="margin:0 0 30px 0;">Выбери сложность игры:</p>';
        stage.appendChild(menu);

        function createBtn(text, color, speed) {
            const btn = document.createElement('button');
            btn.innerText = text;
            btn.style = 'padding:12px 30px; font-size:16px; font-weight:bold; margin:8px; border:none; border-radius:10px; color:white; background:' + color;
            btn.onclick = function() { mouseSpeed = speed; startGame(); };
            menu.appendChild(btn);
        }

        createBtn('👶 Легко', '#4caf50', 4);
        createBtn('⚡️ Нормально', '#ff9800', 8);
        createBtn('🏆 КИБЕРСПОРТ', '#f44336', 15);

        const winScreen = document.createElement('div');
        winScreen.style = 'position:absolute; width:100%; height:100%; background:rgba(20,40,50,0.95); display:none; flex-direction:column; align-items:center; justify-content:center; color:white; z-index:10;';
        winScreen.innerHTML = '<h1 style="color:#4caf50;">🎉 ПОБЕДА! 🎉</h1><p>Мышка успешно поймана!</p>';
        stage.appendChild(winScreen);

        const restartBtn = document.createElement('button');
        restartBtn.innerText = 'В МЕНЮ 🏠';
        restartBtn.style = 'padding:12px 25px; font-size:16px; background:#00d2ff; color:white; border:none; border-radius:10px;';
        restartBtn.onclick = function() { winScreen.style.display = 'none'; menu.style.display = 'flex'; };
        winScreen.appendChild(restartBtn);

        function startGame() {
            menu.style.display = 'none';
            winScreen.style.display = 'none';
            catX = 40; 
            catY = window.innerHeight * 0.4;
            mouseX = window.innerWidth - 80; 
            mouseY = window.innerHeight * 0.4;
            cat.style.left = catX + 'px'; 
            cat.style.top = catY + 'px';
            cat.style.display = 'block'; 
            mouse.style.display = 'block';
            gameActive = true;
            runGameLoop();
        }

        function moveCat(e) {
            if (!gameActive) return;
            let touch = e.touches ? e.touches[0] : e;
            catX = touch.clientX - 25;
            catY = touch.clientY - 25;
            cat.style.left = catX + 'px';
            cat.style.top = catY + 'px';
        }

        stage.addEventListener('touchstart', moveCat);
        stage.addEventListener('touchmove', moveCat);
        stage.addEventListener('mousemove', moveCat);

        function runGameLoop() {
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(function() {
                if (!gameActive) return;
                let dx = mouseX - catX;
                let dy = mouseY - catY;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 220) {
                    mouseX += (dx / dist) * mouseSpeed;
                    mouseY += (dy / dist) * mouseSpeed;
                }

                if (mouseX < 10) mouseX = 10;
                if (mouseX > window.innerWidth - 50) mouseX = window.innerWidth - 50;
                if (mouseY < 10) mouseY = 10;
                if (mouseY > window.innerHeight - 50) mouseY = window.innerHeight - 50;

                mouse.style.left = mouseX + 'px';
                mouse.style.top = mouseY + 'px';

                if (dist < 40) {
                    gameActive = false;
                    clearInterval(gameLoop);
                    cat.style.display = 'none';
                    mouse.style.display = 'none';
                    winScreen.style.display = 'flex';
                }
            }, 20);
        }
    </script>
</body>
</html>
